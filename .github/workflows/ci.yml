name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

      - name: Run frontend unit tests
        run: npx vitest run

  rust-test:
    name: Rust Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy linting
        id: clippy
        run: |
          cargo clippy --all-features -- -W warnings 2>&1 | tee /tmp/clippy.log
        working-directory: src-tauri

      - name: Clippy report
        if: always()
        run: |
          COUNT=$(grep -c 'warning:' /tmp/clippy.log 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning title=clippy::${COUNT} clippy warning(s) detected. Run 'cargo clippy --all-features' locally to fix."
          fi

      - name: Cargo check
        run: cargo check --all-features
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test --all-features
        working-directory: src-tauri
