name: CI

on:
  push:
    branches:
      - dev
      - master
      - 'release/**'
  pull_request:
    branches:
      - dev
      - master
      - 'release/**'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        rust-toolchain: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: rustfmt --check src-tauri/src/**/*.rs

      - name: Clippy linting
        run: cargo clippy --all-features -- -W warnings
        working-directory: src-tauri

      - name: Cargo check
        run: cargo check --all-features
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test --all-features
        working-directory: src-tauri

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update && 
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: exifpro-v__VERSION__
          releaseName: 'ExifPro v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: ${{ github.ref != 'refs/heads/master' }}
          prerelease: ${{ startsWith(github.ref, 'refs/heads/release/') }}

  tag-version:
    name: Tag Version
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |
            const version = process.env.VERSION;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/v${version}`,
              sha: context.sha
            });
        env:
          VERSION: ${{ steps.get_version.outputs.version }}