name: Release

on:
  push:
    branches:
      - 'release/v*'
  pull_request:
    types:
      - closed
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI
    if: |
      startsWith(github.ref, 'refs/heads/release/v') ||
      startsWith(github.event.pull_request.head.ref, 'release/v')
    uses: ./.github/workflows/ci.yml

  prerelease-build:
    name: Prerelease Draft
    needs: ci
    if: startsWith(github.ref, 'refs/heads/release/v')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}-rc.${{ github.run_number }}
          releaseName: 'ExifPro v${{ steps.version.outputs.version }}-rc.${{ github.run_number }}'
          releaseBody: |
            ## 预发布版本 v${{ steps.version.outputs.version }}-rc.${{ github.run_number }}

            此版本仅用于测试，不升级正式版本号。

            ### 变更来源
            分支：${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
          args: >
            --bundles
            ${{ matrix.os == 'ubuntu-latest' && 'deb,rpm' || 'msi,nsis' }}

  build:
    name: Build Artifacts (${{ matrix.os }})
    needs: ci
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v9
        with:
          script: |
            const sourceBranch = '${{ github.event.pull_request.head.ref }}';
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }}
            });
            const notes = commits.map(c =>
              `- ${c.commit.message.split('\n')[0]} (@${c.author?.login || 'unknown'})`
            ).join('\n');
            return [
              `## 正式版本 v${{ steps.version.outputs.version }}`,
              '',
              '### 发布来源',
              `- 分支：\`${sourceBranch}\` → \`master\``,
              `- PR：#${{ github.event.pull_request.number }}`,
              '',
              '### 变更记录',
              notes || '无额外提交记录',
            ].join('\n');

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'ExifPro v${{ steps.version.outputs.version }}'
          releaseBody: ${{ steps.notes.outputs.result }}
          releaseDraft: false
          prerelease: false
          args: >
            --bundles
            ${{ matrix.os == 'ubuntu-latest' && 'deb,rpm' || 'msi,nsis' }}
