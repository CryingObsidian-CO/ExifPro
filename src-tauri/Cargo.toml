[package]
name = "exifpro"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "exifpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
image = "0.25.10"
kamadak-exif = "0.6.1"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.7.0"
chrono = "0.4.44"
base64 = "0.22.1"
zip = "8.5.1"
indexmap = { version = "2.13.1", features = ["serde"] }
tauri-plugin-log = "2.8.0"
tokio-rusqlite-new = "0.13.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "time"] }
log = "0.4.29"
rawler = "0.7.2"
rayon = "1"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }

[profile.release]
opt-level = "s"   # s=体积优先；z极致压缩(编译变慢)，3=性能优先
lto = true        # 链接时优化
codegen-units = 1 # 单编译单元
panic = "abort"   # 取消panic堆栈展开代码
strip = true      # 剔除调试符号
